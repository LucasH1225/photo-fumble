<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Photo Fumble — all concept images</title><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 'Avenir Next',sans-serif;color:#202738;background:#e9edf2}header{padding:32px 4%;border-bottom:1px solid #c7cfda;display:flex;align-items:center;justify-content:space-between}h1{font-size:32px;line-height:1.2;margin:0 0 9px}p{margin:0;color:#566173}nav{display:flex;gap:25px;font-size:14px}.filters{padding:22px 4%;display:flex;gap:16px;position:sticky;top:0;background:#e9edf2f5;z-index:2}label{font-size:12px;display:grid;gap:5px}select,input{font:inherit;padding:9px 12px;border:1px solid #a9b5c5;border-radius:7px;min-height:44px;background:#fff;color:#202738}.grid{padding:0 4% 35px;display:grid;grid-template-columns:1fr 1fr;gap:25px}.card{margin:0;background:white;border-radius:10px;overflow:hidden}.card img{display:block;width:100%;height:auto}.card figcaption{padding:16px 19px}.card strong{display:block;font-size:17px}.card small{color:#606c80;font-size:12px}.card .links{display:flex;gap:22px;margin-top:8px;font-size:12px}a{color:#234bc8}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b82954;outline-offset:4px}[hidden]{display:none!important}.count{margin-left:auto;align-self:center;font-size:13px;color:#59647a}@media(max-width:700px){header{display:block}nav{margin-top:20px}.grid{grid-template-columns:1fr}.filters{flex-wrap:wrap;position:static}input{max-width:180px}h1{font-size:27px}}
</style></head><body><header><div><h1>Every screen, ready to compare.</h1><p>70 stills: 46 desktop, 16 phone, and 8 extra preparation variants.</p></div><nav><a href="index.html">Interactive concepts</a><a href="overview.html">Compare directions</a><a href="../docs/UI_REVIEW_PLAN.md">Full screen plan</a></nav></header><section class="filters"><label>Direction<select id="theme"><option value="all">Both directions</option><option value="pocket">Pocket Prints</option><option value="hours">After Hours</option></select></label><label>Layout<select id="device"><option value="all">All layouts</option><option value="desktop">Desktop</option><option value="phone">Phone</option></select></label><label>Find a screen<input id="search" type="search" placeholder="Quiz, prepare, reveal…"></label><span class="count" id="count"></span></section><main class="grid" id="grid"></main><script>
const files=["pocket-join-desktop.png", "pocket-modes-desktop.png", "pocket-prepare-desktop.png", "pocket-prepared-desktop.png", "pocket-quiz-play-desktop.png", "pocket-quiz-reveal-desktop.png", "pocket-voice-play-desktop.png", "pocket-voice-judge-desktop.png", "pocket-voice-outcome-desktop.png", "pocket-chat-play-desktop.png", "pocket-chat-judge-desktop.png", "pocket-bluff-play-desktop.png", "pocket-bluff-reveal-desktop.png", "pocket-impostor-clear-desktop.png", "pocket-impostor-blurred-desktop.png", "pocket-impostor-vote-desktop.png", "pocket-impostor-reveal-desktop.png", "pocket-results-desktop.png", "pocket-late-desktop.png", "pocket-upload-error-desktop.png", "pocket-reconnecting-desktop.png", "pocket-host-away-desktop.png", "pocket-redaction-desktop.png", "hours-join-desktop.png", "hours-modes-desktop.png", "hours-prepare-desktop.png", "hours-prepared-desktop.png", "hours-quiz-play-desktop.png", "hours-quiz-reveal-desktop.png", "hours-voice-play-desktop.png", "hours-voice-judge-desktop.png", "hours-voice-outcome-desktop.png", "hours-chat-play-desktop.png", "hours-chat-judge-desktop.png", "hours-bluff-play-desktop.png", "hours-bluff-reveal-desktop.png", "hours-impostor-clear-desktop.png", "hours-impostor-blurred-desktop.png", "hours-impostor-vote-desktop.png", "hours-impostor-reveal-desktop.png", "hours-results-desktop.png", "hours-late-desktop.png", "hours-upload-error-desktop.png", "hours-reconnecting-desktop.png", "hours-host-away-desktop.png", "hours-redaction-desktop.png", "pocket-join-phone.png", "pocket-prepare-phone.png", "pocket-quiz-play-phone.png", "pocket-voice-judge-phone.png", "pocket-chat-play-phone.png", "pocket-bluff-reveal-phone.png", "pocket-impostor-blurred-phone.png", "pocket-results-phone.png", "pocket-prepare-voice-desktop.png", "pocket-prepare-chat-desktop.png", "pocket-prepare-bluff-desktop.png", "pocket-prepare-impostor-desktop.png", "hours-join-phone.png", "hours-prepare-phone.png", "hours-quiz-play-phone.png", "hours-voice-judge-phone.png", "hours-chat-play-phone.png", "hours-bluff-reveal-phone.png", "hours-impostor-blurred-phone.png", "hours-results-phone.png", "hours-prepare-voice-desktop.png", "hours-prepare-chat-desktop.png", "hours-prepare-bluff-desktop.png", "hours-prepare-impostor-desktop.png"];const grid=document.getElementById('grid');
const labels={'join':'Join friends','modes':'Choose a mode','prepare':'Prepare one item','prepared':'Ready and waiting','quiz-play':'Quiz: enter a date','quiz-reveal':'Quiz: date and score reveal','voice-play':'Voice: listen and explain','voice-judge':'Voice: context, then judge','voice-outcome':'Voice: individual judgments','chat-play':'Chat: read and explain','chat-judge':'Chat: context, then judge','bluff-play':'Bluff: choose a story','bluff-reveal':'Bluff: truth and fooled friends','impostor-clear':'Impostor: clear private view','impostor-blurred':'Impostor: blurred private view','impostor-vote':'Impostor: suspect vote','impostor-reveal':'Impostor: private-view reveal','results':'Final ranking and shared winners','late':'Newcomer waiting','upload-error':'Upload failed','reconnecting':'Reconnecting','host-away':'Host disconnected','redaction':'Chat: shared-image preview'};
const cards=files.map(f=>{const theme=f.startsWith('pocket')?'pocket':'hours';const device=f.endsWith('phone.png')?'phone':'desktop';let key=f.replace(/^(pocket|hours)-/,'').replace(/-(desktop|phone)\.png$/,'');let mode='';if(key.startsWith('prepare-')){mode=key.slice(8);key='prepare'}const title=(labels[key]||key)+(mode?' · '+mode:'');const url='index.html?theme='+theme+'&screen='+key+'&device='+device+(mode?'&mode='+mode:'')+(['modes','impostor-clear','results'].includes(key)?'&viewer=host':'');return {f,theme,device,title,url}});
function render(){const t=document.getElementById('theme').value,d=document.getElementById('device').value,q=document.getElementById('search').value.toLowerCase();const visible=cards.filter(c=>(t==='all'||c.theme===t)&&(d==='all'||c.device===d)&&c.title.toLowerCase().includes(q));grid.innerHTML=visible.map(c=>'<figure class="card"><a href="review/'+c.f+'"><img loading="lazy" src="review/'+c.f+'" alt="'+c.title+' in '+(c.theme==='pocket'?'Pocket Prints':'After Hours')+'"></a><figcaption><strong>'+c.title+'</strong><small>'+(c.theme==='pocket'?'Pocket Prints':'After Hours')+' / '+c.device+'</small><div class="links"><a href="review/'+c.f+'">Full-size image</a><a href="'+c.url+'">Inspect HTML</a></div></figcaption></figure>').join('');document.getElementById('count').textContent=visible.length+' images'}document.querySelectorAll('select,input').forEach(el=>el.addEventListener('input',render));render();
</script></body></html>

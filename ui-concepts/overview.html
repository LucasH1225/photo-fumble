n{font-size:11px}
</style></head><body><main class="sheet" id="sheet"></main><script>
const p=new URLSearchParams(location.search),layout=p.get('layout')||'compare',theme=p.get('theme')==='hours'?'hours':'pocket',part=Number(p.get('part')||1),title=theme==='hours'?'After Hours':'Pocket Prints';

}else if(layout==='phones'){const screens=part===1?['join','prepare','quiz-play','voice-judge']:['chat-play','bluff-reveal','impostor-blurred','results'];html=head(title+' / on your phone',part===1?'Join, prepare, guess and judge.':'Read the chat, reveal the truth, protect a private view and see the whole ranking.')+'<div class="phone-grid">'+screens.map(s=>'<figure><div class="phone-crop"><img src="review/'+theme+'-'+s+'-phone.png" alt="'+labels[s]+' phone"></div><figcaption>'+labels[s]+'<small>'+ (s==='results'?'Shared winners, fresh scores':s==='impostor-blurred'?'Same photo, fewer clues':s==='voice-judge'?'Real context comes first':s==='prepare'?'One item; private answer':'One clear task at a time')+'</small></figcaption></figure>').join('')+'</div>'+bottom;
}else{const screens=layout==='qa'?all.slice((part-1)*6,part*6):['quiz-play','voice-play','chat-play','bluff-play','impostor-blurred','results'];document.getElementById('sheet').classList.toggle('qa',layout==='qa');html=head(title+' / '+(layout==='qa'?'screen review '+part:'five modes, one visual family'),layout==='qa'?'Settled HTML captures; inspect full-size files for details.':'The media changes. The action and waiting states stay familiar.')+'<div class="small-grid">'+screens.map(s=>'<figure><img src="review/'+theme+'-'+s+'-desktop.png" alt="'+labels[s]+'"><figcaption>'+labels[s]+'<small>'+ (s==='results'?'Automatic, full-group ranking':'Stable media and one current task')+'</small></figcaption></figure>').join('')+'</div>'+bottom;}document.getElementById('sheet').innerHTML=html;
